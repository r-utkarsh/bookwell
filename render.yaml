services:
  - type: web
    name: bookwell-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: "None"
      - key: TRUST_FORWARDED_HEADERS
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: DB_URL
        fromDatabase:
          name: bookwell-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: bookwell-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bookwell-db
          property: password
      - key: DB_POOL_SIZE
        value: "5"
      - key: DEFAULT_TIME_ZONE
        value: Asia/Kolkata
      - key: DEFAULT_CURRENCY
        value: INR
      - key: NOTIFICATIONS_ENABLED
        value: "true"
      - key: NOTIFICATION_WORKER_ENABLED
        value: "true"
      - key: MAIL_MODE
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Bookwell
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_AUTH
        value: "true"
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: Platform Administrator
      - key: SEED_ENABLED
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"

databases:
  - name: bookwell-db
    databaseName: bookwell
    user: bookwell
    plan: free
